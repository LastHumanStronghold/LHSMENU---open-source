name: Build LHSMENU with Quick Skin

on:
  workflow_dispatch:
  push:
    paths:
      - "quickskin/**"
      - ".github/workflows/build-quickskin.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Create compile-time API stubs
        shell: bash
        run: |
          mkdir -p quickskin/stubs/com/mainlhs/client/screen quickskin/stubs/net/minecraft/client/gui/components quickskin/stubs/net/minecraft/client/gui/screens quickskin/stubs/net/minecraft/client quickskin/stubs/net/minecraft/network/chat quickskin/stubs/net/minecraftforge/api/distmarker quickskin/stubs/net/minecraftforge/client/event quickskin/stubs/net/minecraftforge/eventbus/api quickskin/stubs/net/minecraftforge/fml quickskin/stubs/net/minecraftforge/fml/common
          echo 'package net.minecraft.client.gui.screens; public class Screen { public int f_96543_; public int f_96544_; }' > quickskin/stubs/net/minecraft/client/gui/screens/Screen.java
          echo 'package com.mainlhs.client.screen; public class MainMenuScreen extends net.minecraft.client.gui.screens.Screen {}' > quickskin/stubs/com/mainlhs/client/screen/MainMenuScreen.java
          echo 'package net.minecraft.client.gui.screens; public class PauseScreen extends Screen {}' > quickskin/stubs/net/minecraft/client/gui/screens/PauseScreen.java
          echo 'package net.minecraft.client; import net.minecraft.client.gui.screens.Screen; public class Minecraft { public static Minecraft getInstance(){return null;} public void setScreen(Screen s){} }' > quickskin/stubs/net/minecraft/client/Minecraft.java
          cat > quickskin/stubs/net/minecraft/client/gui/components/Button.java <<'EOF'
          package net.minecraft.client.gui.components;
          import net.minecraft.network.chat.Component;
          import java.util.function.Consumer;
          public class Button { public static Builder builder(Component c, Consumer<Button> a){return new Builder();} public static class Builder { public Builder bounds(int x,int y,int w,int h){return this;} public Button build(){return new Button();} } }
          EOF
          echo 'package net.minecraft.network.chat; public interface Component { static MutableComponent m_237115_(String s){return null;} }' > quickskin/stubs/net/minecraft/network/chat/Component.java
          echo 'package net.minecraft.network.chat; public class MutableComponent implements Component {}' > quickskin/stubs/net/minecraft/network/chat/MutableComponent.java
          echo 'package net.minecraftforge.api.distmarker; public enum Dist { CLIENT, DEDICATED_SERVER }' > quickskin/stubs/net/minecraftforge/api/distmarker/Dist.java
          echo 'package net.minecraftforge.eventbus.api; import java.lang.annotation.*; @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.METHOD) public @interface SubscribeEvent {}' > quickskin/stubs/net/minecraftforge/eventbus/api/SubscribeEvent.java
          cat > quickskin/stubs/net/minecraftforge/fml/common/Mod.java <<'EOF'
          package net.minecraftforge.fml.common;
          import java.lang.annotation.*;
          import net.minecraftforge.api.distmarker.Dist;
          public @interface Mod { @Retention(RetentionPolicy.RUNTIME) @Target(ElementType.TYPE) public @interface EventBusSubscriber { String modid(); Bus bus(); Dist[] value() default {}; enum Bus { FORGE, MOD } } }
          EOF
          echo 'package net.minecraftforge.fml; public class ModList { public static ModList get(){return null;} public boolean isLoaded(String id){return false;} }' > quickskin/stubs/net/minecraftforge/fml/ModList.java
          cat > quickskin/stubs/net/minecraftforge/client/event/ScreenEvent.java <<'EOF'
          package net.minecraftforge.client.event;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.gui.components.Button;
          public class ScreenEvent { public static class Init { public static class Post { public Screen getScreen(){return null;} public void addListener(Button b){} } } }
          EOF
      - name: Compile integration class
        run: |
          mkdir -p quickskin/out
          javac --release 17 -encoding UTF-8 -d quickskin/out $(find quickskin/stubs -name '*.java') quickskin/src/QuickSkinMenuIntegration.java
      - name: Patch combined LHSMENU JAR
        run: |
          test -f LHSMENU.jar
          cp LHSMENU.jar LHSMENU-QuickSkin.jar
          jar uf LHSMENU-QuickSkin.jar -C quickskin/out net/lhs/lobby/QuickSkinMenuIntegration.class
          jar tf LHSMENU-QuickSkin.jar | grep -q 'net/lhs/lobby/QuickSkinMenuIntegration.class'
      - uses: actions/upload-artifact@v4
        with:
          name: LHSMENU-QuickSkin
          path: LHSMENU-QuickSkin.jar
          if-no-files-found: error
          retention-days: 30
