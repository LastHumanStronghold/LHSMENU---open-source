name: Recover LHSMENU Java sources

on:
  workflow_dispatch:
  push:
    paths:
      - "LHSMENU.jar"
      - ".github/workflows/recover-sources.yml"

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download CFR decompiler
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://www.benf.org/other/cfr/cfr-0.152.jar \
            -o /tmp/cfr.jar
          test -s /tmp/cfr.jar

      - name: Extract JAR and resources
        run: |
          test -s LHSMENU.jar
          rm -rf recovered-source /tmp/lhs-jar
          mkdir -p recovered-source/java recovered-source/resources
          unzip -oq LHSMENU.jar -d /tmp/lhs-jar
          find /tmp/lhs-jar -type f ! -name '*.class' ! -path '*/META-INF/MANIFEST.MF' \
            -exec sh -c 'for f do dest="recovered-source/resources/${f#/tmp/lhs-jar/}"; mkdir -p "$(dirname "$dest")"; cp "$f" "$dest"; done' sh {} +
          cp /tmp/lhs-jar/META-INF/mods.toml recovered-source/mods.toml

      - name: Verify and overlay current Lobby/Auth binary supplement
        shell: bash
        run: |
          set -euo pipefail

          # Reassemble the current Lobby/Auth classes uploaded from the user's JAR.
          cat recovery-input/supplement-part-*.b64 > /tmp/lobby-auth-supplement.b64
          echo "Supplement base64 bytes: $(wc -c < /tmp/lobby-auth-supplement.b64)"
          echo "50113e227f0f291293b4783ce50e23ceb5101f1a7451bd32e9a943346d501605  /tmp/lobby-auth-supplement.b64" | sha256sum -c -
          base64 -d /tmp/lobby-auth-supplement.b64 > /tmp/lobby-auth-supplement.zip
          echo "a169a536d24fd3b2b96bc41223f45d30e714d309ebb078160cbfb0afb1b2fa3f  /tmp/lobby-auth-supplement.zip" | sha256sum -c -
          unzip -tq /tmp/lobby-auth-supplement.zip
          rm -rf /tmp/lobby-auth-supplement
          mkdir -p /tmp/lobby-auth-supplement
          unzip -oq /tmp/lobby-auth-supplement.zip -d /tmp/lobby-auth-supplement

          # The archive uses short prefixes; bytecode contains the full packages.
          mkdir -p /tmp/lhs-jar/net/lhs /tmp/lhs-jar/ru/lhs/auth /tmp/lhs-jar/assets
          cp -a /tmp/lobby-auth-supplement/supplemental/lhs/lobby /tmp/lhs-jar/net/lhs/
          cp -a /tmp/lobby-auth-supplement/supplemental/lhs/auth/client /tmp/lhs-jar/ru/lhs/auth/
          cp -a /tmp/lobby-auth-supplement/supplemental/assets/lhs_lobby /tmp/lhs-jar/assets/
          cp /tmp/lobby-auth-supplement/supplemental/mods.toml /tmp/lhs-jar/META-INF/mods.toml

          # Include recovered translations and the correct three-mod metadata.
          mkdir -p recovered-source/resources/META-INF recovered-source/resources/assets
          cp /tmp/lhs-jar/META-INF/mods.toml recovered-source/mods.toml
          cp /tmp/lhs-jar/META-INF/mods.toml recovered-source/resources/META-INF/mods.toml
          cp -a /tmp/lhs-jar/assets/lhs_lobby recovered-source/resources/assets/

          echo "Overlay class inventory:"
          find /tmp/lhs-jar/net/lhs/lobby /tmp/lhs-jar/ru/lhs/auth/client -type f -name '*.class' | sort

      - name: Decompile main LHS module
        run: |
          java -jar /tmp/cfr.jar LHSMENU.jar \
            --outputdir recovered-source/java \
            --silent true

      - name: Inspect embedded modules and decompile Lobby/Auth classes
        shell: bash
        run: |
          set -euo pipefail

          echo "Binary SHA-256:"
          sha256sum LHSMENU.jar
          echo "Lobby/Auth class entries in LHSMENU.jar:"
          jar tf LHSMENU.jar | grep -E '^(net/lhs/lobby|ru/lhs/auth/client)/.*\.class$' || true

          # Use shell globs so every top-level class is processed deterministically.
          for package in net/lhs/lobby ru/lhs/auth/client; do
            package_dir="/tmp/lhs-jar/$package"
            echo "Inspecting package: $package_dir"
            if [[ ! -d "$package_dir" ]]; then
              echo "::error::Package directory missing: $package_dir"
              find /tmp/lhs-jar -maxdepth 5 -type d | sort | tail -80
              exit 1
            fi

            shopt -s nullglob
            found=0
            for class_file in "$package_dir"/*.class; do
              [[ "$class_file" == *'$'* ]] && continue
              found=$((found + 1))
              echo "Decompiling $class_file"
              java -jar /tmp/cfr.jar "$class_file" \
                --outputdir recovered-source/java \
                --silent true
            done
            if [[ "$found" -eq 0 ]]; then
              echo "::error::No top-level class files found in $package_dir"
              ls -la "$package_dir"
              exit 1
            fi
          done

          echo "Generated package files:"
          find recovered-source/java/net/lhs/lobby recovered-source/java/ru/lhs/auth/client \
            -maxdepth 1 -type f -name '*.java' -print | sort || true

          # Required client GUI and keybinding sources.
          test -s recovered-source/java/net/lhs/lobby/LHSLobbyClient.java
          test -s recovered-source/java/net/lhs/lobby/LobbyScreen.java
          test -s recovered-source/java/net/lhs/lobby/LobbyTabList.java
          test -s recovered-source/java/ru/lhs/auth/client/LHSAuthClient.java
          test -s recovered-source/java/ru/lhs/auth/client/AuthScreen.java

      - name: Verify M key and GUI dispatch from original bytecode
        run: |
          mkdir -p recovered-source/verification
          javap -classpath /tmp/lhs-jar -c -p net.lhs.lobby.LHSLobbyClient \
            > recovered-source/verification/LHSLobbyClient.bytecode.txt
          javap -classpath /tmp/lhs-jar -c -p 'net.lhs.lobby.LHSLobbyClient$ClientEvents' \
            > recovered-source/verification/LHSLobbyClient-ClientEvents.bytecode.txt

          grep -Fq 'key.lhs_lobby.open' recovered-source/verification/LHSLobbyClient.bytecode.txt
          grep -Eq 'bipush[[:space:]]+77' recovered-source/verification/LHSLobbyClient.bytecode.txt
          grep -Fq 'LobbyScreen' recovered-source/verification/LHSLobbyClient-ClientEvents.bytecode.txt

          cat > recovered-source/verification/KEYBINDING.md <<'EOF'
          # LHS Lobby keybinding verification

          Verified with javap against the Lobby/Auth class files extracted
          from the user's current LHSMENU build:

          - Key translation key: `key.lhs_lobby.open`
          - GLFW key code: `77` (M)
          - Registered by: `net.lhs.lobby.LHSLobbyClient.registerKeys`
          - Input handler: `net.lhs.lobby.LHSLobbyClient$ClientEvents.keyInput`
          - GUI opened: `net.lhs.lobby.LobbyScreen`

          The adjacent bytecode reports are generated from the uploaded
          compiled class files. This check does not depend on CFR's output.
          EOF

      - name: Build source index and recovery report
        run: |
          find recovered-source/java -name '*.java' | sort > recovered-source/CLASS_INDEX.txt
          printf 'Recovered Java source files: '
          wc -l < recovered-source/CLASS_INDEX.txt

          cat > recovered-source/README.md <<'EOF'
          # LHSMENU recovered source

          This archive combines:
          - Main LHS Java sources decompiled from the repository-root LHSMENU.jar
          - LHS Lobby and LHS Auth classes extracted from the current LHSMENU build
          - Lobby Russian/English translations and the matching three-mod mods.toml

          ## Included modules
          - mainlhs — 1.5.0
          - lhs_auth — 1.1.0
          - lhs_lobby — 1.1.0

          ## Important packages
          - `com/mainlhs/` — main LHS menu and shared systems
          - `net/lhs/lobby/` — Lobby GUI, Tab list and M keybinding
          - `ru/lhs/auth/client/` — in-game authentication interface and API

          ## M key
          The recovered `LHSLobbyClient.java` registers
          `key.lhs_lobby.open` on GLFW key code 77 (M). Its client input
          handler opens `LobbyScreen`. The `verification/` directory contains
          javap bytecode reports and a short verification note.

          ## Recovery limits
          These are decompiled sources, not the original developer-authored
          project. Comments and original local variable names cannot be recovered
          from bytecode. Some Minecraft/Forge symbols retain production names,
          so a clean Gradle rebuild is not guaranteed without matching mappings
          and dependencies.

          The repository-root LHSMENU.jar is an older main-module binary.
          Lobby/Auth classes and translations are supplied by the checked
          supplement in `recovery-input/`. CI verifies the supplement SHA-256,
          the required Java files, and the M-key-to-LobbyScreen bytecode path.
          EOF

          sha256sum LHSMENU.jar > recovered-source/ORIGINAL_JAR_SHA256.txt

      - name: Package source archive
        run: zip -qr LHSMENU-source.zip recovered-source

      - name: Verify final archive
        run: |
          unzip -l LHSMENU-source.zip > /tmp/archive-list.txt
          grep -Fq 'recovered-source/java/net/lhs/lobby/LHSLobbyClient.java' /tmp/archive-list.txt
          grep -Fq 'recovered-source/java/net/lhs/lobby/LobbyScreen.java' /tmp/archive-list.txt
          grep -Fq 'recovered-source/java/ru/lhs/auth/client/LHSAuthClient.java' /tmp/archive-list.txt
          grep -Fq 'recovered-source/java/ru/lhs/auth/client/AuthScreen.java' /tmp/archive-list.txt
          unzip -p LHSMENU-source.zip recovered-source/verification/KEYBINDING.md | grep -Fq '77` (M)'

      - name: Commit recovered source archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered-source LHSMENU-source.zip
          if git diff --cached --quiet; then
            echo "No recovered source changes."
            exit 0
          fi
          git commit -m "Recover complete Lobby and Auth sources and verify M key"
          git push
